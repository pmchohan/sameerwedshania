<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06252d" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Sameer and Hania's wedding invitation is coming soon."
    />
    <meta property="og:title" content="Sameer &amp; Hania — coming soon" />
    <meta
      property="og:description"
      content="A wedding invitation is on its way. Please check back soon."
    />
    <title>Sameer &amp; Hania — coming soon</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #06252d;
        --ground-deep: #03181f;
        --gold: #f5d34f;
        --pearl: #eff9f8;
        --mist: #c1dddd;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        min-height: 100%;
        background: var(--ground-deep);
      }

      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        color: var(--pearl);
        font-family: "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      ::selection {
        color: var(--ground-deep);
        background: var(--gold);
      }

      .stage {
        position: relative;
        display: grid;
        min-height: 100svh;
        overflow: hidden;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) 18px
          max(28px, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse at 50% 40%, rgb(17 83 88 / 56%), transparent 58%),
          linear-gradient(145deg, var(--ground), var(--ground-deep) 82%);
      }

      .arch {
        position: absolute;
        width: min(100%, 520px);
        height: min(88svh, 720px);
        min-height: 480px;
        overflow: visible;
        pointer-events: none;
      }

      .arch path,
      .arch circle {
        fill: none;
        stroke: var(--gold);
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }

      .arch .outline {
        opacity: 0.6;
        stroke-width: 1.2;
        stroke-dasharray: 1900;
        stroke-dashoffset: 1900;
        animation: draw-arch 1.5s cubic-bezier(0.2, 0.75, 0.25, 1) 0.1s forwards;
      }

      .arch .inner {
        opacity: 0.38;
        stroke-width: 0.8;
      }

      .arch .jali {
        opacity: 0.24;
        stroke-width: 0.7;
      }

      .arch .rosette {
        opacity: 0.76;
        stroke-width: 1;
      }

      .content {
        position: relative;
        width: min(100%, 370px);
        padding: 0 16px;
        text-align: center;
        animation: arrive 850ms cubic-bezier(0.2, 0.75, 0.25, 1) 250ms both;
      }

      h1 {
        margin: 0;
        color: var(--pearl);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.45rem, 10vw, 4.15rem);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.08;
        text-wrap: balance;
      }

      h1 span {
        display: block;
        margin: 7px 0 8px;
        color: var(--gold);
        font-size: 0.48em;
        font-style: italic;
        letter-spacing: 0;
      }

      .ornament {
        display: block;
        width: 76px;
        height: 18px;
        margin: 27px auto 23px;
        color: var(--gold);
      }

      .message {
        margin: 0 auto;
        color: var(--mist);
        font-size: 1rem;
        line-height: 1.75;
      }

      @keyframes draw-arch {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 360px) {
        .content {
          padding-inline: 8px;
        }
      }

      @media (max-height: 620px) {
        .arch {
          height: 94svh;
          min-height: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <svg class="arch" viewBox="0 0 520 720" aria-hidden="true" focusable="false">
        <path class="outline" d="M28 692V323C28 159 122 42 260 28c138 14 232 131 232 295v369" />
        <path class="inner" d="M48 692V326C48 174 132 66 260 52c128 14 212 122 212 274v366" />
        <path class="jali" d="M93 691V340c0-119 65-208 167-224 102 16 167 105 167 224v351M128 691V348c0-98 49-170 132-188 83 18 132 90 132 188v343M162 691V362c0-75 34-130 98-148 64 18 98 73 98 148v329M194 691V370c0-54 21-94 66-112 45 18 66 58 66 112v321M100 453h320M91 516h338M83 579h354M78 642h364M118 383l284 284M151 331l267 267M193 294l228 228M402 383 118 667M369 331 102 598M327 294 99 522" />
        <path class="rosette" d="M260 92c9 12 9 20 0 30-9-10-9-18 0-30Zm-15 15c12-9 20-9 30 0-10 9-18 9-30 0Zm15 15c-9-12-9-20 0-30 9 10 9 18 0 30Zm15-15c-12 9-20 9-30 0 10-9 18-9 30 0Z" />
        <circle class="rosette" cx="260" cy="107" r="22" />
      </svg>

      <section class="content" aria-labelledby="title">
        <h1 id="title">Sameer <span>&amp;</span> Hania</h1>
        <svg class="ornament" viewBox="0 0 76 18" aria-hidden="true" focusable="false">
          <path d="M1 9h28m18 0h28M30 9c4-8 12-8 16 0-4 8-12 8-16 0Zm8-5v10" fill="none" stroke="currentColor" stroke-width="1" />
        </svg>
        <p class="message">Our wedding invitation is in the making.<br />Please check back soon.</p>
      </section>
    </main>
  </body>
</html>
